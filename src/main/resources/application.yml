server:
  port: 8080

spring:
  application:
    name: backend_customers
  datasource:
    url: jdbc:h2:mem:customersdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    defer-datasource-initialization: true
    show-sql: false
  sql:
    init:
      mode: always
      encoding: UTF-8
  jackson:
    time-zone: America/Lima

app:
  cors:
    allowed-origins: http://localhost:4200

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.indigital.customers: INFO
